# Tensura Magic Affordability Filter
#
# Mobs do Tensura nascem com magia que nao tem magiculo para pagar.
# Um slime tem ~435 de magiculo; Wind Cutter custa 500, Fire Ball 30000.
# A magia fica de enfeite: o onRelease tem um portao silencioso de
# energia que retorna sem erro nenhum, e nada acontece.
#
# Este mod REMOVE do mob a magia que ele nao consegue pagar, em vez de
# inflar o magiculo dele. Assim o balanceamento de quem definiu os
# valores continua intacto, e o que sobra o mob usa de verdade.
#
# Ele nao conjura nada - quem conjura e o MobSkillController do
# Alex's Complete Compatibility.

enabled=true

# Ticks apos o spawn ate rodar a filtragem.
# Nao pode ser 0: o Tensura ainda esta atribuindo as magias.
pruneDelayTicks=20

# true  = filtra so mobs do namespace tensura
# false = filtra qualquer mob (os balanceados pelo Alex's Compat tem
#         magiculo de sobra e passam no teste de qualquer forma)
onlyTensuraMobs=false

# Mostra no log o que foi removido e o que foi mantido, por mob.
debugLog=false

# SOM DE CONJURACAO
# O Tensura so toca o som de conjuracao para jogadores: o
# applyCastingVisual comeca com 'instanceof Player' e sai sem fazer
# nada se for mob. Isto devolve o som, usando os proprios sons do
# mod e escolhendo pelo elemento da magia:
#   vento -> ability.cast.wind_cast   fogo  -> ability.cast.fire_cast
#   terra -> ability.cast.earth_cast  agua  -> ability.cast.water_cast
#   gelo, raio e espaco tambem tem o seu; o resto usa o generico.
castSound=true
castSoundVolume=1.0
castSoundPitch=1.0

# CIRCULO MAGICO
# Usa a entidade MagicCircle do proprio Tensura, com a variante do
# elemento da magia (vento, chama, terra, agua, gelo, espaco...).
# Ele acompanha o mob e gira, igual ao do jogador.
castCircle=true
castCircleDistance=1.5

# LENTIDAO AO CONJURAR
# O magic_config.toml aplica castingSpeed = 0.25 no jogador que conjura
# (-75% de velocidade), mas isso nunca chega no mob: quem aplica os
# modificadores e o addHeldAttributeModifiers, e o onHeld nunca o chama -
# o onTick so os remove.
# O valor e o nivel: 5 = Lentidao V = -75%, o mesmo do jogador.
# 6 ou 7 deixa o mob quase parado. 0 desliga.
castingSlowness=5
